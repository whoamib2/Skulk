databases:
  - name: skulk-db
    plan: free
    region: ohio
    postgresMajorVersion: "16"
    databaseName: skulk_db
    user: skulk_db_user

services:
  - type: web
    name: skulk
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skulk-db
          property: connectionString
